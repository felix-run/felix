[project]
name = "felix"
version = "0.2.2"
description = "Felix — a self-hostable managed agents harness. YAML manifests compile into governed agents with durable fibers, memory, skills, eval, approvals, and sandboxes — over OpenAI, A2A, MCP, and SSE."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Blake Bauman", email = "blake.bauman@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "felix-ai",
    "felix-harness",
    "felix-cli",
    "felix-api",
    "felix-worker",
]

[project.urls]
Homepage = "https://docs.felix.run"
Repository = "https://github.com/felix-run/felix"
Issues = "https://github.com/felix-run/felix/issues"
Documentation = "https://docs.felix.run"

# Forward extras so `uv sync --extra aws` works from the repo root.
[project.optional-dependencies]
aws = ["felix-harness[aws]"]
gcp = ["felix-harness[gcp]"]
otel = ["felix-harness[otel]"]
mcp = ["felix-harness[mcp]"]
a2a = ["felix-harness[a2a]"]
oidc = ["felix-harness[oidc]"]
granian = ["felix-harness[granian]"]
browser = ["felix-harness[browser]"]
embeddings = ["felix-harness[embeddings]"]
warehouse = ["felix-harness[warehouse]"]
warehouse-clickhouse = ["felix-harness[warehouse-clickhouse]"]
warehouse-doris = ["felix-harness[warehouse-doris]"]
temporal = ["felix-harness[temporal]"]
sandbox = ["felix-harness[sandbox]"]
pii = ["felix-harness[pii]"]
full = [
    "felix-harness[aws,gcp,otel,mcp]",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4.0",
    "anyio>=4.14.2",
    "ruff>=0.16.5",
    "ty>=0.0.75",
    "fakeredis>=2.37.1",
    "httpx>=0.28.1",
    "pre-commit>=4.6.2",
    "pytest-cov>=7.1.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.uv.sources]
felix-ai = { workspace = true }
felix-harness = { workspace = true }
felix-cli = { workspace = true }
felix-api = { workspace = true }
felix-worker = { workspace = true }

[tool.ruff]
line-length = 110
target-version = "py314"
src = ["packages", "apps", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]
# ASYNC109/240: intentional sync Path/timeout APIs in CLI and approval waiters.
# E731: now_ms = lambda is used widely across stores for a one-liner clock.
# SIM102: nested auth/env guards kept explicit for readability.
# RUF001/002: en-dash in user-facing copy is intentional.
ignore = [
    "B008",
    "ASYNC109",
    "ASYNC240",
    "E731",
    "SIM102",
    "SIM108",
    "RUF001",
    "RUF002",
    "RUF034",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "RUF012", "RUF034"]

# Coverage is measured in CI with `--cov --cov-fail-under`; it is deliberately
# not in pytest addopts so a single-test run stays fast.
[tool.coverage.run]
source = [
    "packages/ai/src/felix_ai",
    "packages/harness/src/felix",
    "packages/cli/src/felix_cli",
    "apps/api/src/felix_api",
    "apps/worker/src/felix_worker",
]
branch = false

[tool.coverage.report]
skip_covered = false
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 120
timeout_method = "thread"

[tool.ty.environment]
python-version = "3.14"

# ty is still catching up on asyncio Protocols / SQLAlchemy Mapped attrs /
# third-party stubs (taskiq-redis). Keep unresolved imports as errors; soften
# the rest so CI gates new import breakage without blocking on pre-existing debt.
[tool.ty.terminal]
error-on-warning = false

[tool.ty.rules]
invalid-argument-type = "warn"
invalid-assignment = "warn"
invalid-await = "warn"
invalid-return-type = "warn"
invalid-type-form = "warn"
unresolved-attribute = "warn"
