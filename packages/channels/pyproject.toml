[project]
name = "felix-channels"
version = "0.15.1"
description = "Chat-platform channels for Felix: talk to an agent from Slack. An optional plugin."
requires-python = ">=3.14"
license = "Apache-2.0"
# Core never imports this package (tests/unit/test_plugin_boundary.py); it arrives through the
# `felix.plugins` entry point below, so installing it is the whole of turning it on.
dependencies = [
    "felix-harness",
]

[project.entry-points."felix.plugins"]
channels = "felix_channels:register"

[project.urls]
Homepage = "https://github.com/felix-run/felix"
Repository = "https://github.com/felix-run/felix"
Issues = "https://github.com/felix-run/felix/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/felix_channels"]
