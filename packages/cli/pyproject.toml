[project]
name = "felix-cli"
version = "0.2.2"
description = "Felix CLI — migrate, eval, mint-jwt, bundle-manifests, doctor."
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = [
    "felix-harness",
    "typer>=0.27.2",
    "rich>=15.0.0",
]

[project.urls]
Homepage = "https://github.com/felix-run/felix"
Repository = "https://github.com/felix-run/felix"
Issues = "https://github.com/felix-run/felix/issues"

[project.scripts]
felix = "felix_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/felix_cli"]

[tool.uv.sources]
felix-harness = { workspace = true }
