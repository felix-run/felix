[project]
name = "felix-ai"
version = "0.2.2"
description = "Felix model layer — wire formats, providers, and model catalog. Depends on nothing in Felix."
requires-python = ">=3.14"
license = "Apache-2.0"
# Deliberately minimal. This package is the proof that Felix is model-agnostic: it may not
# import `felix`, and an invariant test enforces that. Everything it needs from the harness
# arrives as a Protocol or a parameter.
dependencies = [
    "httpx>=0.28.1",
]

[project.urls]
Homepage = "https://github.com/felix-run/felix"
Repository = "https://github.com/felix-run/felix"
Issues = "https://github.com/felix-run/felix/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/felix_ai"]
