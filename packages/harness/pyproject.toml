[project]
name = "felix-harness"
version = "0.2.0"
description = "Felix agent harness — manifests, patterns, tools, session, governance, protocols."
requires-python = ">=3.14"
license = "Apache-2.0"
# Core stays lean for small VMs / slim Docker images.
# Cloud SDKs, embeddings, browser, OTel, etc. are optional extras.
dependencies = [
    "fastapi[standard]>=0.141.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "psycopg[binary,pool]>=3.3.4",
    "alembic>=1.19.1",
    "pgvector>=0.5.0",
    "httpx>=0.28.1",
    "joserfc>=1.7.4",
    "cryptography>=50.0.0",
    "structlog>=26.1.0",
    "prometheus-client>=0.26.0",
    "ruamel.yaml>=0.19.1",
    "redis>=8.1.0",
    "taskiq>=0.12.5",
    "taskiq-redis>=1.1.2",
    "openai>=3.3.1",
    "anthropic>=1.0.0",
    "sse-starlette>=3.4.8",
    "python-multipart>=0.0.22",
]

[project.urls]
Homepage = "https://github.com/felix-run/felix"
Repository = "https://github.com/felix-run/felix"
Issues = "https://github.com/felix-run/felix/issues"

[project.optional-dependencies]
sandbox = ["docker>=7.1"]
browser = ["playwright>=1.57"]
mcp = ["mcp>=1.26"]
a2a = ["httpx>=0.28.1"]
otel = [
    "opentelemetry-api>=1.39.0",
    "opentelemetry-sdk>=1.39.0",
    "opentelemetry-instrumentation-fastapi>=0.60b0",
    "opentelemetry-exporter-otlp>=1.39.0",
    "opentelemetry-exporter-prometheus>=0.60b0",
]
embeddings = ["sentence-transformers>=5.0"]
oidc = ["joserfc>=1.7.4"]
pii = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2"]
# Analytics warehouse — DuckDB is the locked default recommendation.
warehouse = ["duckdb>=1.4", "polars>=1.37"]
warehouse-clickhouse = ["clickhouse-connect>=0.8"]
warehouse-doris = ["pymysql>=1.1"]
temporal = ["temporalio>=1.21"]
granian = ["granian>=2.8.1"]
# AWS first-class — S3 / Secrets Manager (also covers MinIO via S3 API)
aws = ["boto3>=1.42", "aiobotocore>=3.9.0"]
# GCP first-class — GCS / Secret Manager
gcp = ["google-cloud-storage>=3.9", "google-cloud-secret-manager>=2.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/felix"]
