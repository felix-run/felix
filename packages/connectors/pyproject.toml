[project]
name = "felix-connectors"
version = "0.19.2"
description = "Tools that reach everyday services for Felix agents: weather, maps, markets, Google, iCloud, calendar feeds. An optional plugin."
requires-python = ">=3.14"
license = "Apache-2.0"
# Core never imports this package (tests/unit/test_plugin_boundary.py); it arrives through the
# `felix.plugins` entry point below, so installing it is the whole of turning it on. A manifest
# still names each tool in `spec.tools` before any agent holds it.
dependencies = [
    "felix-harness",
]

[project.optional-dependencies]
# The Google tools (Calendar, Gmail, Drive) build their requests with Google's own client, from
# the discovery documents it ships; Felix's egress-guarded client sends them.
google = ["google-api-python-client>=2.201.0"]
# The iCloud tools (Calendar, Contacts) speak CalDAV and CardDAV through Felix's egress-guarded
# client; these read and write what travels in it -- iCalendar events and vCards.
icloud = ["icalendar>=7.3.0", "recurring-ical-events>=3.8.2", "vobject>=0.9.9"]
# The calendar feed tool reads a published `.ics` link through the same guarded client.
ics = ["icalendar>=7.3.0", "recurring-ical-events>=3.8.2"]

[project.entry-points."felix.plugins"]
connectors = "felix_connectors:register"

[project.urls]
Homepage = "https://github.com/felix-run/felix"
Repository = "https://github.com/felix-run/felix"
Issues = "https://github.com/felix-run/felix/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/felix_connectors"]
