{{- if and (not .Values.secrets.existingSecret) (not .Values.externalSecrets.enabled) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "felix.fullname" . }}
  labels:
    {{- include "felix.labels" . | nindent 4 }}
type: Opaque
stringData:
  FELIX_DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  FELIX_REDIS_URL: {{ .Values.secrets.redisUrl | quote }}
  FELIX_S3_ACCESS_KEY: {{ .Values.secrets.s3AccessKey | quote }}
  FELIX_S3_SECRET_KEY: {{ .Values.secrets.s3SecretKey | quote }}
  FELIX_ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  FELIX_OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  FELIX_JWKS_PRIVATE: {{ .Values.secrets.jwksPrivate | quote }}
  FELIX_JWKS_PUBLIC: {{ .Values.secrets.jwksPublic | quote }}
  FELIX_CONSUMER_SHARED_SECRET: {{ .Values.secrets.consumerSharedSecret | quote }}
{{- end }}
