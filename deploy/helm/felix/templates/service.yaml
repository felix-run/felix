apiVersion: v1
kind: Service
metadata:
  name: {{ include "felix.fullname" . }}
  labels:
    {{- include "felix.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  # api pods only: worker and scheduler pods carry the same instance labels and no port.
  selector:
    {{- include "felix.componentSelectorLabels" (dict "root" . "component" "api") | nindent 4 }}
