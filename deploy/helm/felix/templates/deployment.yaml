apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "felix.fullname" . }}
  labels:
    {{- include "felix.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "felix.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "felix.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "felix.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-data" (include "felix.fullname" .)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Runtime image has /app/.venv on PATH — do not use `uv run` (uv is builder-only).
          command: ["felix-api"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
          envFrom:
            - configMapRef:
                name: {{ include "felix.fullname" . }}
          env:
            - name: FELIX_DATA_DIR
              value: /data
            - name: FELIX_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "felix.secretName" . }}
                  key: FELIX_DATABASE_URL
            - name: FELIX_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "felix.secretName" . }}
                  key: FELIX_REDIS_URL
            - name: FELIX_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "felix.secretName" . }}
                  key: FELIX_S3_ACCESS_KEY
                  optional: true
            - name: FELIX_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "felix.secretName" . }}
                  key: FELIX_S3_SECRET_KEY
                  optional: true
            - name: FELIX_ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "felix.secretName" . }}
                  key: FELIX_ANTHROPIC_API_KEY
                  optional: true
            - name: FELIX_JWKS_PUBLIC
              valueFrom:
                secretKeyRef:
                  name: {{ include "felix.secretName" . }}
                  key: FELIX_JWKS_PUBLIC
                  optional: true
            - name: FELIX_JWKS_PRIVATE
              valueFrom:
                secretKeyRef:
                  name: {{ include "felix.secretName" . }}
                  key: FELIX_JWKS_PRIVATE
                  optional: true
            - name: FELIX_CONSUMER_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "felix.secretName" . }}
                  key: FELIX_CONSUMER_SHARED_SECRET
                  optional: true
            - name: FELIX_S3_ENDPOINT
              value: {{ .Values.s3.endpoint | quote }}
            - name: FELIX_S3_BUCKET
              value: {{ .Values.s3.bucket | quote }}
            - name: FELIX_S3_REGION
              value: {{ .Values.s3.region | quote }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["felix-worker"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
          envFrom:
            - configMapRef:
                name: {{ include "felix.fullname" . }}
          env:
            - name: FELIX_DATA_DIR
              value: /data
            - name: FELIX_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "felix.secretName" . }}
                  key: FELIX_DATABASE_URL
            - name: FELIX_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "felix.secretName" . }}
                  key: FELIX_REDIS_URL
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        - name: scheduler
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["felix-scheduler"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
          envFrom:
            - configMapRef:
                name: {{ include "felix.fullname" . }}
          env:
            - name: FELIX_DATA_DIR
              value: /data
            - name: FELIX_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "felix.secretName" . }}
                  key: FELIX_DATABASE_URL
            - name: FELIX_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "felix.secretName" . }}
                  key: FELIX_REDIS_URL
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: "250m"
              memory: 256Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
