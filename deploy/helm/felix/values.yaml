replicaCount: 1

image:
  repository: felix
  tag: "0.1.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  tls: []

config:
  FELIX_ENVIRONMENT: production
  FELIX_AUTH_MODE: jwt
  # Lean chart default — use s3/gcs only with matching image extras (aws/gcp).
  FELIX_OBJECT_STORE: fs
  FELIX_DATA_DIR: /data
  FELIX_DEFAULT_MANIFEST: quick
  FELIX_DURABILITY: fibers
  FELIX_HIBERNATE_AFTER_SECONDS: "300"
  FELIX_OTEL_ENABLED: "false"
  FELIX_WAREHOUSE: none

secrets:
  # Prefer an existing K8s Secret or External Secrets Operator (see README).
  # Chart-managed stringData is for bootstrap only — do not commit real tokens.
  existingSecret: ""
  databaseUrl: ""
  redisUrl: ""
  s3AccessKey: ""
  s3SecretKey: ""
  anthropicApiKey: ""
  openaiApiKey: ""
  jwksPrivate: ""
  jwksPublic: ""
  oauthCacheKey: ""
  # Required for /internal/* when auth_mode != none (or production).
  consumerSharedSecret: ""

# Sync platform secrets from a cluster SecretStore (AWS SM / GCP SM / Vault…).
# When enabled, set secrets.existingSecret to the target secret name (defaults
# to the release name) so Deployments keep using envFrom secretRef.
externalSecrets:
  enabled: false
  refreshInterval: 1h
  targetSecretName: ""
  secretStore:
    name: felix-secret-store
    kind: ClusterSecretStore
  data:
    - secretKey: FELIX_DATABASE_URL
      remoteKey: felix/database-url
    - secretKey: FELIX_REDIS_URL
      remoteKey: felix/redis-url
    - secretKey: FELIX_ANTHROPIC_API_KEY
      remoteKey: felix/anthropic-api-key
    - secretKey: FELIX_OPENAI_API_KEY
      remoteKey: felix/openai-api-key
    - secretKey: FELIX_CONSUMER_SHARED_SECRET
      remoteKey: felix/consumer-shared-secret

s3:
  endpoint: ""
  bucket: felix-bundles
  region: us-east-1

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

resources:
  # Small-VM friendly defaults; raise for production traffic.
  requests:
    cpu: 50m
    memory: 192Mi
  limits:
    cpu: "1"
    memory: 1Gi

nodeSelector: {}
tolerations: []
affinity: {}

podSecurityContext:
  fsGroup: 10001
  runAsNonRoot: true
  runAsUser: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# Writable /data for FELIX_OBJECT_STORE=fs (and warehouse duckdb files).
# Enable when using fs so pods survive restarts.
persistence:
  enabled: false
  existingClaim: ""
  size: 10Gi
  accessMode: ReadWriteOnce
  storageClass: ""

# Alembic via `felix migrate head` before install/upgrade (Helm pre-hook).
migrate:
  enabled: true
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: "250m"
      memory: 256Mi
