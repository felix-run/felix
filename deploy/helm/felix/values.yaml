image:
  # The published image. `felix`, the old default, resolved to docker.io/library/felix,
  # which does not exist, so `helm install` from the tree went straight to
  # ImagePullBackOff.
  repository: ghcr.io/felix-run/felix
  tag: "0.2.2"
  pullPolicy: IfNotPresent

# One Deployment per process. The Service, the HPA and the PDB select the api alone;
# the worker scales on its own count; the scheduler is always exactly one.
api:
  replicaCount: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  # maxUnavailable rather than minAvailable by default: with one replica,
  # `minAvailable: 1` denies every voluntary eviction and a node drain never completes.
  # Null maxUnavailable to use minAvailable once replicaCount makes it meaningful.
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
    minAvailable: 1
  # Long enough for an in-flight SSE turn to finish on a rolling update or drain.
  terminationGracePeriodSeconds: 120
  # preStop delay so the endpoint slice drops the pod before the server stops accepting.
  preStopSleepSeconds: 5
  # Small-VM friendly defaults; raise for production traffic.
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      cpu: "1"
      memory: 1Gi

worker:
  replicaCount: 1
  terminationGracePeriodSeconds: 120
  # Prometheus endpoint on the worker, also its liveness probe. 0 disables both — and
  # leaves a wedged worker invisible. UNAUTHENTICATED and bound on all interfaces: a
  # containerPort only, never behind the Service, and any pod in the cluster can reach
  # it by pod IP. Restrict it to your Prometheus with a NetworkPolicy (chart README).
  metricsPort: 9464
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      cpu: "1"
      memory: 1Gi

scheduler:
  # No replicaCount: always one, `Recreate` strategy. See deployment-scheduler.yaml.
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: "250m"
      memory: 256Mi

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  tls: []

config:
  FELIX_ENVIRONMENT: production
  FELIX_AUTH_MODE: jwt
  # Lean chart default — use s3/gcs only with matching image extras (aws/gcp).
  FELIX_OBJECT_STORE: fs
  FELIX_DATA_DIR: /data
  FELIX_DEFAULT_MANIFEST: quick
  # store = tenant Postgres versions + write API; bundled = image only, no write routes.
  FELIX_MANIFEST_SOURCE: store
  FELIX_DURABILITY: fibers
  FELIX_HIBERNATE_AFTER_SECONDS: "300"
  FELIX_OTEL_ENABLED: "false"
  # Collector address. grpc -> :4317, http -> :4318 (and what a hosted OTLP ingest wants).
  FELIX_OTEL_ENDPOINT: "http://otel-collector:4317"
  FELIX_OTEL_PROTOCOL: "grpc"
  # `k=v,k2=v2` — the only way to authenticate to a collector. Put credentials in a
  # secret and mount them; do not inline them here.
  FELIX_OTEL_HEADERS: ""
  FELIX_OTEL_INSECURE: "true"
  FELIX_OTEL_SAMPLE_RATIO: "1.0"
  # Prompts/completions on spans. Off: a tracing backend is an egress destination.
  FELIX_OTEL_CAPTURE_CONTENT: "false"
  # user.id / tenant on spans. session.id (thread) is emitted regardless.
  FELIX_OTEL_CAPTURE_IDENTITY: "true"
  FELIX_WAREHOUSE: none
  # Extra SKILL.md directory; mount it via extraVolumes when set.
  FELIX_SKILLS_DIR: ""
  # Opt-in after alembic upgrade to 0006_tenant_rls.
  FELIX_DATABASE_RLS: "false"

secrets:
  # Prefer an existing K8s Secret or External Secrets Operator (see README).
  # Chart-managed stringData is for bootstrap only — do not commit real tokens.
  existingSecret: ""
  databaseUrl: ""
  redisUrl: ""
  s3AccessKey: ""
  s3SecretKey: ""
  anthropicApiKey: ""
  openaiApiKey: ""
  jwksPrivate: ""
  jwksPublic: ""
  oauthCacheKey: ""
  # Required for /internal/* when auth_mode != none (or production).
  consumerSharedSecret: ""

# Sync platform secrets from a cluster SecretStore (AWS SM / GCP SM / Vault…).
# When enabled, set secrets.existingSecret to the target secret name (defaults
# to the release name) so Deployments keep using envFrom secretRef.
externalSecrets:
  enabled: false
  refreshInterval: 1h
  targetSecretName: ""
  secretStore:
    name: felix-secret-store
    kind: ClusterSecretStore
  data:
    - secretKey: FELIX_DATABASE_URL
      remoteKey: felix/database-url
    - secretKey: FELIX_REDIS_URL
      remoteKey: felix/redis-url
    - secretKey: FELIX_ANTHROPIC_API_KEY
      remoteKey: felix/anthropic-api-key
    - secretKey: FELIX_OPENAI_API_KEY
      remoteKey: felix/openai-api-key
    - secretKey: FELIX_CONSUMER_SHARED_SECRET
      remoteKey: felix/consumer-shared-secret

s3:
  endpoint: ""
  bucket: felix-bundles
  region: us-east-1

# Alerting rules for Prometheus Operator, from files/prometheus-rules.yml — the same file
# the Compose observability overlay mounts. Set `labels` to what your Prometheus's
# ruleSelector matches on.
prometheusRule:
  enabled: false
  namespace: ""
  labels: {}

# Prometheus Operator scrape of /metrics. Requires the ServiceMonitor CRD.
serviceMonitor:
  enabled: false
  # Empty = same namespace as the release.
  namespace: ""
  # Labels your Prometheus instance's serviceMonitorSelector matches on.
  labels: {}
  interval: 30s
  scrapeTimeout: 10s
  # /metrics is authenticated on purpose: its labels carry tenant-supplied manifest ids
  # and remote MCP tool names. Point this at a Secret holding a Felix API key with an
  # empty `scopes` array — /metrics has no scope gate, so an unscoped key reads metrics
  # and can do nothing else.
  bearerTokenSecret:
    name: ""
    key: token
  # `manifest_id` is tenant-supplied and MCP tool names come from a remote server, so
  # cardinality is bounded by your tenants, not by you. Drop or relabel series here if a
  # tenant's naming becomes a problem.
  metricRelabelings: []

nodeSelector: {}
tolerations: []
affinity: {}

podSecurityContext:
  fsGroup: 10001
  runAsNonRoot: true
  runAsUser: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# Writable /data for FELIX_OBJECT_STORE=fs (and warehouse duckdb files).
# Enable when using fs so pods survive restarts. api and worker are separate pods now,
# so with `fs` the claim has to be ReadWriteMany (or both pods pinned to one node) for
# an artifact the api spills to be readable by the worker — or use s3/gcs.
persistence:
  enabled: false
  existingClaim: ""
  size: 10Gi
  accessMode: ReadWriteOnce
  storageClass: ""

# Alembic via `felix migrate head` before install/upgrade (Helm pre-hook).
migrate:
  enabled: true
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: "250m"
      memory: 256Mi
