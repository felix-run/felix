replicaCount: 1

image:
  repository: felix
  tag: "0.2.2"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  tls: []

config:
  FELIX_ENVIRONMENT: production
  FELIX_AUTH_MODE: jwt
  # Lean chart default — use s3/gcs only with matching image extras (aws/gcp).
  FELIX_OBJECT_STORE: fs
  FELIX_DATA_DIR: /data
  FELIX_DEFAULT_MANIFEST: quick
  # store = tenant Postgres versions + write API; bundled = image only, no write routes.
  FELIX_MANIFEST_SOURCE: store
  FELIX_DURABILITY: fibers
  FELIX_HIBERNATE_AFTER_SECONDS: "300"
  FELIX_OTEL_ENABLED: "false"
  # Collector address. grpc -> :4317, http -> :4318 (and what a hosted OTLP ingest wants).
  FELIX_OTEL_ENDPOINT: "http://otel-collector:4317"
  FELIX_OTEL_PROTOCOL: "grpc"
  # `k=v,k2=v2` — the only way to authenticate to a collector. Put credentials in a
  # secret and mount them; do not inline them here.
  FELIX_OTEL_HEADERS: ""
  FELIX_OTEL_INSECURE: "true"
  FELIX_OTEL_SAMPLE_RATIO: "1.0"
  # Prompts/completions on spans. Off: a tracing backend is an egress destination.
  FELIX_OTEL_CAPTURE_CONTENT: "false"
  # Worker-only Prometheus port (0 = off). UNAUTHENTICATED — never expose it via a Service
  # reachable outside the cluster.
  FELIX_METRICS_PORT: "0"
  FELIX_WAREHOUSE: none
  # Extra SKILL.md directory; mount it via extraVolumes when set.
  FELIX_SKILLS_DIR: ""
  # Opt-in after alembic upgrade to 0006_tenant_rls.
  FELIX_DATABASE_RLS: "false"

secrets:
  # Prefer an existing K8s Secret or External Secrets Operator (see README).
  # Chart-managed stringData is for bootstrap only — do not commit real tokens.
  existingSecret: ""
  databaseUrl: ""
  redisUrl: ""
  s3AccessKey: ""
  s3SecretKey: ""
  anthropicApiKey: ""
  openaiApiKey: ""
  jwksPrivate: ""
  jwksPublic: ""
  oauthCacheKey: ""
  # Required for /internal/* when auth_mode != none (or production).
  consumerSharedSecret: ""

# Sync platform secrets from a cluster SecretStore (AWS SM / GCP SM / Vault…).
# When enabled, set secrets.existingSecret to the target secret name (defaults
# to the release name) so Deployments keep using envFrom secretRef.
externalSecrets:
  enabled: false
  refreshInterval: 1h
  targetSecretName: ""
  secretStore:
    name: felix-secret-store
    kind: ClusterSecretStore
  data:
    - secretKey: FELIX_DATABASE_URL
      remoteKey: felix/database-url
    - secretKey: FELIX_REDIS_URL
      remoteKey: felix/redis-url
    - secretKey: FELIX_ANTHROPIC_API_KEY
      remoteKey: felix/anthropic-api-key
    - secretKey: FELIX_OPENAI_API_KEY
      remoteKey: felix/openai-api-key
    - secretKey: FELIX_CONSUMER_SHARED_SECRET
      remoteKey: felix/consumer-shared-secret

s3:
  endpoint: ""
  bucket: felix-bundles
  region: us-east-1

# Prometheus Operator scrape of /metrics. Requires the ServiceMonitor CRD.
serviceMonitor:
  enabled: false
  # Empty = same namespace as the release.
  namespace: ""
  # Labels your Prometheus instance's serviceMonitorSelector matches on.
  labels: {}
  interval: 30s
  scrapeTimeout: 10s
  # /metrics is authenticated on purpose: its labels carry tenant-supplied manifest ids
  # and remote MCP tool names. Point this at a Secret holding a Felix API key with an
  # empty `scopes` array — /metrics has no scope gate, so an unscoped key reads metrics
  # and can do nothing else.
  bearerTokenSecret:
    name: ""
    key: token
  # `manifest_id` is tenant-supplied and MCP tool names come from a remote server, so
  # cardinality is bounded by your tenants, not by you. Drop or relabel series here if a
  # tenant's naming becomes a problem.
  metricRelabelings: []

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

resources:
  # Small-VM friendly defaults; raise for production traffic.
  requests:
    cpu: 50m
    memory: 192Mi
  limits:
    cpu: "1"
    memory: 1Gi

nodeSelector: {}
tolerations: []
affinity: {}

podSecurityContext:
  fsGroup: 10001
  runAsNonRoot: true
  runAsUser: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# Writable /data for FELIX_OBJECT_STORE=fs (and warehouse duckdb files).
# Enable when using fs so pods survive restarts.
persistence:
  enabled: false
  existingClaim: ""
  size: 10Gi
  accessMode: ReadWriteOnce
  storageClass: ""

# Alembic via `felix migrate head` before install/upgrade (Helm pre-hook).
migrate:
  enabled: true
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: "250m"
      memory: 256Mi
