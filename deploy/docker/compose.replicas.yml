# Two API replicas behind one origin.
#
# Why this exists as a runnable stack rather than a paragraph: almost everything in
# Felix behaves identically on one replica and on two, so the parts that do not are
# exactly the parts nothing exercises by accident. Specifically —
#
#   * a resume stream reattaches to whichever replica the origin picks, which is not
#     the one that ran the turn. `session/notify.py` is what carries the wake across,
#     and on a single replica the in-process waiter answers first so Redis is never
#     consulted at all.
#   * steer, approvals and fiber leases are Redis- and Postgres-backed for the same
#     reason, and a second replica is what proves they are not quietly process-local.
#
#   docker compose -f deploy/docker/compose.yml \
#                  -f deploy/docker/compose.replicas.yml --project-directory . up
#
# Or `make up-replicas`. Combine with compose.pgbouncer.yml when you want both --
# two replicas is also the case that makes the connection ceiling arrive sooner,
# since the pool is per process.
#
# nginx is here as a load balancer only. It is not a recommendation about your
# production ingress; any origin that round-robins will do.

name: felix

services:
  api:
    # The origin publishes the port now. Publishing it here too would bind the same
    # host port twice and only one replica would come up.
    ports: !reset []
    deploy:
      replicas: 2

  origin:
    image: nginx:1.29-alpine
    ports:
      - "${FELIX_BIND_ADDR:-127.0.0.1}:${FELIX_PORT:-8080}:8080"
    volumes:
      - ./deploy/docker/nginx-replicas.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: ${FELIX_ORIGIN_MEM_LIMIT:-32m}
    restart: unless-stopped
