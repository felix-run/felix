# Round-robin across whatever `api` resolves to.
#
# `resolve` is not available in open-source nginx, so the upstream is the Docker DNS
# name and nginx re-resolves per request via the resolver below. 127.0.0.11 is
# Docker's embedded DNS; `ipv6=off` because it answers AAAA for names that have no
# IPv6 address and nginx then tries it first.
resolver 127.0.0.11 ipv6=off valid=10s;

# `upstream_addr` is the only thing in this file that makes the setup observable: the
# replicas do not log requests themselves, so without it there is no way to tell a
# working round-robin from every request landing on one container.
log_format replicas '$remote_addr "$request" $status upstream=$upstream_addr';
access_log /var/log/nginx/access.log replicas;

server {
    listen 8080;

    # SSE is the reason this file has any settings at all. Buffering a stream is the
    # default and it defeats the entire point: the client would receive nothing until
    # the response completed, so a resume stream would look hung rather than live.
    proxy_buffering off;
    proxy_cache off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Long enough to outlast an idle resume stream (300s by default) plus its poll,
    # so the origin is not what closes a healthy connection.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        set $upstream http://api:8080;
        proxy_pass $upstream;
    }
}
