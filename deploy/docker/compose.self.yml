# Overlay: Felix builds Felix. See docs/SELF.md and deploy/docker/README.md.
# Usage (repo root):
#   make up-self
#   docker compose -f deploy/docker/compose.yml -f deploy/docker/compose.self.yml \
#     --project-directory . up --build
#
# The api and worker run the builder image (deploy/docker/Dockerfile.builder): the lean image
# plus git, make and uv, with a separate clone of the repository at /workspace that the
# `contributor` and `triage` manifests edit and run the gates in. The host these two
# containers are is the shell tool's boundary — deploy/GOVERNANCE.md "Shell tools" — so they
# mount no Docker socket, carry no cloud credentials, and share the workspace with no person.

name: felix

x-self-build: &self-build
  build:
    context: .
    dockerfile: deploy/docker/Dockerfile.builder
    args:
      BASE_IMAGE: felix:latest
  image: felix-self:latest

x-self-env: &self-env
  # Approvals must not be anonymous: under `none` the caller could approve its own mutation.
  # The base anchor already defaults to api_key; pinned here so an overlay cannot loosen it.
  FELIX_AUTH_MODE: api_key
  FELIX_WORKSPACE_ROOT: /workspace
  # The argv prefixes the shell tool may exec — exactly what `contributor.yaml` declares, so
  # the manifest's own list is what narrows. `git push`, `git remote`, `gh`, `uv run python`
  # are deliberately absent; publishing goes through GitHub MCP with the bot's token.
  FELIX_SHELL_ALLOWED_COMMANDS: ${FELIX_SHELL_ALLOWED_COMMANDS:-uv run ruff,uv run ty,./scripts/test.sh,make lint,make type,make test,make schema,uv run felix validate-manifest,git status,git diff,git log,git fetch,git switch,git restore,git stash,git add,git commit,git branch,git show,git rev-parse,git mv,git rm}
  # Resolved by the `env` secrets backend for `mcp_servers[].auth: secret:GITHUB_MCP_TOKEN`.
  # Empty binds an agent with no GitHub tools (logged, not fatal) — set it in .env.
  GITHUB_MCP_TOKEN: ${GITHUB_MCP_TOKEN:-}
  # The default 120s is a chat timeout. A contributor turn carries the skill catalogue, a
  # long transcript and a publication instruction, and the model answers in one go — three
  # runs died here at ~120s, each losing the whole transcript, because `post_with_retry`
  # deliberately does not retry a ReadTimeout (the bytes were already accepted; the fix is
  # a larger ceiling, not three of them).
  FELIX_MODEL_TIMEOUT_SECONDS: ${FELIX_MODEL_TIMEOUT_SECONDS:-600}
  FELIX_SELF_REPO: ${FELIX_SELF_REPO:-https://github.com/felix-run/felix.git}
  FELIX_SELF_BRANCH: ${FELIX_SELF_BRANCH:-main}

services:
  api:
    <<: *self-build
    environment:
      <<: *self-env
    volumes: !override
      - felix-data:/data
      - felix-self-workspace:/workspace
    # The test suite runs inside this container; the lean default is too small for it.
    mem_limit: ${FELIX_SELF_MEM_LIMIT:-3g}
    cpus: ${FELIX_SELF_CPUS:-2.0}

  worker:
    <<: *self-build
    environment:
      <<: *self-env
    volumes: !override
      - felix-data:/data
      - felix-self-workspace:/workspace
    mem_limit: ${FELIX_SELF_MEM_LIMIT:-3g}
    cpus: ${FELIX_SELF_CPUS:-2.0}

volumes:
  felix-self-workspace:
