# Felix local stack — api, worker, Postgres+pgvector, Valkey, MinIO.
# Run from repo root (see deploy/docker/README.md):
#   make up
#   make up-lite
#   docker compose -f deploy/docker/compose.yml --project-directory . up --build

name: felix

x-felix-env: &felix-env
  FELIX_ENVIRONMENT: ${FELIX_ENVIRONMENT:-development}
  FELIX_ALLOW_INSECURE: ${FELIX_ALLOW_INSECURE:-false}
  # The container binds 0.0.0.0 and the port is published, so this must not default to
  # `none` — that would expose PUT /manifests, and with it stdio MCP command execution.
  # `make up` runs scripts/dev-key.sh, which writes a local key into .env on first run.
  FELIX_AUTH_MODE: ${FELIX_AUTH_MODE:-api_key}
  FELIX_AUTH_API_KEYS: ${FELIX_AUTH_API_KEYS:?run `make up` (or scripts/dev-key.sh) to generate a local API key}
  # Commands MCP stdio servers may spawn. Empty = stdio disabled (the default).
  FELIX_MCP_STDIO_ALLOWED_COMMANDS: ${FELIX_MCP_STDIO_ALLOWED_COMMANDS:-}
  FELIX_CONSUMER_SHARED_SECRET: ${FELIX_CONSUMER_SHARED_SECRET:-}
  FELIX_DATABASE_URL: postgresql+psycopg://felix:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (openssl rand -hex 32)}@postgres:5432/felix
  FELIX_REDIS_URL: redis://valkey:6379/0
  FELIX_ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  FELIX_OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  # Resume-stream pacing. Documented in .env.example but unreachable from Compose
  # until now, which made them untunable in exactly the deployment that needs them.
  # The literals repeat `Settings`' own defaults, so
  # tests/unit/test_compose_defaults.py asserts they still match.
  FELIX_STREAM_RESUME_IDLE_SECONDS: ${FELIX_STREAM_RESUME_IDLE_SECONDS:-300}
  FELIX_STREAM_RESUME_POLL_SECONDS: ${FELIX_STREAM_RESUME_POLL_SECONDS:-1}
  FELIX_STREAM_RESUME_POLL_MAX_SECONDS: ${FELIX_STREAM_RESUME_POLL_MAX_SECONDS:-10}
  FELIX_DEFAULT_MANIFEST: ${FELIX_DEFAULT_MANIFEST:-quick}
  FELIX_DEFAULT_MODEL_ID: ${FELIX_DEFAULT_MODEL_ID:-claude-sonnet}
  FELIX_MODEL_ROUTES: ${FELIX_MODEL_ROUTES:-}
  FELIX_OLLAMA_BASE_URL: ${FELIX_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  FELIX_WORKSPACE_ROOT: ${FELIX_WORKSPACE_ROOT:-/workspace}
  # Extra SKILL.md directory, searched alongside the image's bundled skills/.
  # Mount it into the container as well when you set this.
  FELIX_SKILLS_DIR: ${FELIX_SKILLS_DIR:-}
  # Analytics spill (recommended duckdb). Requires FELIX_DOCKER_EXTRAS=warehouse
  FELIX_WAREHOUSE: ${FELIX_WAREHOUSE:-none}
  FELIX_DATA_DIR: /data
  FELIX_SECRETS_BACKEND: ${FELIX_SECRETS_BACKEND:-env}
  FELIX_GCP_PROJECT: ${FELIX_GCP_PROJECT:-}
  FELIX_AWS_REGION: ${FELIX_AWS_REGION:-}

# One image for every Felix process. Lean by default; FELIX_DOCKER_EXTRAS=aws,gcp adds
# the cloud SDKs. Overlays that pull a published image `!reset` the build (see gcp).
x-felix-build: &felix-build
  build:
    context: .
    dockerfile: deploy/docker/Dockerfile
    args:
      FELIX_EXTRAS: ${FELIX_DOCKER_EXTRAS:-}
  image: felix:latest

services:
  # Applies Alembic migrations, then exits; every Felix process waits on it, so the app
  # never boots against a schema it does not have yet. Reaches Postgres directly on
  # purpose — the pgbouncer overlay leaves this URL alone, because a migration is an
  # admin action, not request traffic to multiplex. `felix migrate` only ever upgrades
  # and is idempotent, so a re-`up` re-running it is cheap.
  migrate:
    <<: *felix-build
    command: ["felix", "migrate", "head"]
    environment:
      <<: *felix-env
      # Nothing but the database is needed to migrate; the object store is not opened.
      FELIX_OBJECT_STORE: memory
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: ${FELIX_MIGRATE_MEM_LIMIT:-256m}
    cpus: ${FELIX_MIGRATE_CPUS:-0.5}
    healthcheck:
      disable: true
    restart: "no"

  api:
    <<: *felix-build
    command: ["felix-api"]
    # Compose kills a container 10s after `stop` by default; the API drains in-flight
    # turns for FELIX_GRACEFUL_SHUTDOWN_SECONDS (120), so give it that long here too.
    stop_grace_period: 120s
    ports:
      - "${FELIX_BIND_ADDR:-127.0.0.1}:${FELIX_PORT:-8080}:8080"
    environment:
      <<: *felix-env
      # Default to filesystem store so lean images work without MinIO/aws extra.
      FELIX_OBJECT_STORE: ${FELIX_OBJECT_STORE:-fs}
      FELIX_S3_ENDPOINT: ${FELIX_S3_ENDPOINT:-http://minio:9000}
      FELIX_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-felix}
      FELIX_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-}
      FELIX_S3_BUCKET: felix-bundles
    volumes:
      - felix-data:/data
      - ${FELIX_WORKSPACE_HOST:-./workspace}:/workspace
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    mem_limit: ${FELIX_API_MEM_LIMIT:-768m}
    cpus: ${FELIX_API_CPUS:-1.0}
    restart: unless-stopped

  worker:
    <<: *felix-build
    command: ["felix-worker"]
    environment:
      <<: *felix-env
      FELIX_OBJECT_STORE: ${FELIX_OBJECT_STORE:-fs}
      FELIX_S3_ENDPOINT: ${FELIX_S3_ENDPOINT:-http://minio:9000}
      FELIX_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-felix}
      FELIX_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-}
      FELIX_S3_BUCKET: felix-bundles
    volumes:
      - felix-data:/data
      - ${FELIX_WORKSPACE_HOST:-./workspace}:/workspace
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      api:
        condition: service_started
    mem_limit: ${FELIX_WORKER_MEM_LIMIT:-512m}
    cpus: ${FELIX_WORKER_CPUS:-0.5}
    # Image HEALTHCHECK probes API /health; disable so the worker isn't marked unhealthy.
    healthcheck:
      disable: true
    restart: unless-stopped

  # Enqueues labeled Taskiq cron tasks (audit flush, jobs, fibers, …).
  scheduler:
    <<: *felix-build
    command: ["felix-scheduler"]
    environment:
      <<: *felix-env
      FELIX_OBJECT_STORE: ${FELIX_OBJECT_STORE:-fs}
      FELIX_S3_ENDPOINT: ${FELIX_S3_ENDPOINT:-http://minio:9000}
      FELIX_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-felix}
      FELIX_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-}
      FELIX_S3_BUCKET: felix-bundles
    volumes:
      - felix-data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      worker:
        condition: service_started
    mem_limit: ${FELIX_SCHEDULER_MEM_LIMIT:-256m}
    cpus: ${FELIX_SCHEDULER_CPUS:-0.25}
    healthcheck:
      disable: true
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    environment:
      POSTGRES_USER: felix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (openssl rand -hex 32)}
      POSTGRES_DB: felix
    # Tuned for small VMs; override via FELIX_PG_ARGS for larger hosts.
    command:
      - postgres
      - -c
      - shared_buffers=${FELIX_PG_SHARED_BUFFERS:-128MB}
      - -c
      - max_connections=${FELIX_PG_MAX_CONNECTIONS:-100}
      - -c
      - effective_cache_size=${FELIX_PG_EFFECTIVE_CACHE:-256MB}
      - -c
      - work_mem=${FELIX_PG_WORK_MEM:-4MB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Bind loopback only — use lite overlay to publish nothing on small/public VMs.
    ports:
      - "127.0.0.1:${FELIX_PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U felix"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: ${FELIX_PG_MEM_LIMIT:-512m}
    cpus: ${FELIX_PG_CPUS:-1.0}
    restart: unless-stopped

  # Valkey — BSD-3 Redis-protocol fork (Redis 7.4+ left OSI licensing).
  valkey:
    image: valkey/valkey:8-alpine@sha256:e0eb7c480958d32bdc4357a74bdd70653ae15f2f9b4c93c4a5a9fad1dc471c84
    command: ["valkey-server", "--maxmemory", "${FELIX_VALKEY_MAXMEMORY:-64mb}", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - valkey-data:/data
    ports:
      - "127.0.0.1:${FELIX_VALKEY_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: ${FELIX_VALKEY_MEM_LIMIT:-128m}
    cpus: ${FELIX_VALKEY_CPUS:-0.25}
    restart: unless-stopped

  # Optional object store — enable with: docker compose --profile full up
  minio:
    profiles: ["full"]
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-felix}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env for profile=full}
    ports:
      # Loopback like every other service; MinIO holds spilled artifacts and uploads.
      - "${FELIX_BIND_ADDR:-127.0.0.1}:9000:9000"
      - "${FELIX_BIND_ADDR:-127.0.0.1}:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: ${FELIX_MINIO_MEM_LIMIT:-256m}
    cpus: ${FELIX_MINIO_CPUS:-0.5}
    restart: unless-stopped

volumes:
  felix-data:
  postgres-data:
  valkey-data:
  minio-data:
