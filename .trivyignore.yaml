# Findings the image scan may pass over, each with a reason and a date it stops working.
#
# Empty, and worth keeping empty. `expired_at` is the point of the format: an entry here is
# a decision to ship a known finding for a stated reason, and a decision like that should
# lapse rather than persist. After the date Trivy reports the finding again and the release
# fails until someone re-decides. A comment would not do that.
#
# Adding an entry is not routine. The scan runs with `--ignore-unfixed`, so everything it
# reports already has a patch available upstream — "wait for a fix" is never the reason.
#
# The one entry this file has held so far is the example worth remembering. Six pcre2 CVEs,
# three CRITICAL, on `linux/arm64` only: `psycopg[binary]`'s aarch64 wheel vendored RHEL 8's
# pcre2 and declared it in an auditwheel SBOM, so `apt-get upgrade` could not reach it and
# the Debian package in the same image was already patched. It was suppressed for 0.3.0 with
# a one-month expiry, and then the expiry was not needed: `deploy/docker/Dockerfile` now
# installs `psycopg[c]`, which links the system libpq and vendors nothing, and the findings
# went away because the library did. Prefer that shape — remove the thing rather than the
# report — and keep the date short enough that it stays the likelier option.
#
# Both scans read this file: `ci.yml` via the action's `trivyignores`, and `release.yml` by
# mounting the workspace and passing `--ignorefile`, because that one runs Trivy in a
# container that would otherwise look inside its own image and find nothing.

