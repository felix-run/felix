[project]
name = "felix-worker"
version = "0.2.1"
description = "Felix worker — Taskiq jobs for audit, cron, fibers, retention."
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = [
    "felix-harness",
]

[project.urls]
Homepage = "https://github.com/felix-run/felix"
Repository = "https://github.com/felix-run/felix"
Issues = "https://github.com/felix-run/felix/issues"

[project.scripts]
felix-worker = "felix_worker.main:main"
felix-scheduler = "felix_worker.main:scheduler_main"
felix-temporal-worker = "felix_worker.main:temporal_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/felix_worker"]

[tool.uv.sources]
felix-harness = { workspace = true }
