[project]
name = "felix-api"
version = "0.2.2"
description = "Felix API — FastAPI HTTP surface for the agent harness."
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = [
    "felix-harness",
    "granian>=2.8.2",
]

[project.urls]
Homepage = "https://github.com/felix-run/felix"
Repository = "https://github.com/felix-run/felix"
Issues = "https://github.com/felix-run/felix/issues"

[project.scripts]
felix-api = "felix_api.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/felix_api"]

[tool.uv.sources]
felix-harness = { workspace = true }
