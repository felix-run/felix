# yaml-language-server: $schema=../schemas/manifest.schema.json
apiVersion: felix/v1
kind: Agent
metadata:
  name: cowork
  version: 1.0.0
  description: Felix workspace agent — goals, files, client tools, and approvals.
  tags: [react, workspace, durable]

spec:
  pattern: react

  model:
    temperature: 0

  system_prompt:
    inline: |
      You are Felix, a workspace agent.
      Complete user goals by reading and editing files in the workspace, using
      client tools when local/browser actions are required, and pausing for
      approval when a gated tool is invoked.
      Prefer small, reversible changes. Summarize what you did when finished.
      Always refer to yourself as Felix, never as Claude or any other name.

  tools:
    - calculator
    - list_dir
    - read_file
    - write_file
    - search_files
    - list_skills
    - activate_skill
    - deactivate_skill

  client_tools:
    - name: local_shell
      description: Run a shell command in the user's local environment.
      args_schema:
        type: object
        properties:
          command:
            type: string
            description: Shell command to run.
          cwd:
            type: string
            description: Optional working directory.
        required: [command]
        additionalProperties: false
      timeout_seconds: 300
    - name: local_open
      description: Open a local path or URL in the user's environment.
      args_schema:
        type: object
        properties:
          target:
            type: string
            description: File path or URL to open.
        required: [target]
        additionalProperties: false
      timeout_seconds: 60

  skills:
    - name: calculator-help

  approvals:
    - id: workspace-write
      description: Confirm writes to the workspace
      tools: [write_file]
      ttl_seconds: 600
    - id: client-shell
      description: Confirm local shell commands
      tools: [local_shell]
      ttl_seconds: 600

  # `local_shell` and `local_open` run on the user's own machine through the client bridge,
  # so their output is attacker-reachable in the ordinary way: a file, a page or a command
  # result can carry injected instructions back into the transcript. Approval gates whether
  # the command runs; screening is what looks at what comes back. Marker-only — no `model`,
  # so this is a substring scan and costs nothing per call.
  content_screening:
    enabled: true
    on_flag: quarantine
    # `read_file`, `search_files` and `list_dir` are `transport: local`, so the untrusted-tool
    # default does not cover them — but they read the same filesystem `local_shell` does, and
    # they are the route an agent prefers over `cat`. Naming them here adds screening; the
    # list cannot narrow it away from the client tools.
    # `read_file`, `search_files` and `list_dir` are `transport: local`, so the untrusted-tool
    # default does not cover them — but they read the same filesystem `local_shell` does, and
    # they are the route an agent prefers over `cat`. `recall` and `list_memories` are here for
    # the re-entry path: capture runs over turns that include client-tool output, so a string
    # quarantined on the way in can be recalled later as a plain fact. The list only ever adds;
    # it cannot narrow screening away from the client tools.
    tools: [read_file, search_files, list_dir, recall, list_memories]

  limits:
    max_tool_calls: 200
    max_wall_clock_seconds: 3600

  max_turns: 40

  execution:
    mode: durable

  session:
    strategy: compacting
    reserve_tokens: 16384
    keep_recent_tokens: 20000
    context_window_tokens: 128000
    compaction_enabled: true

  memory:
    checkpointer: postgres
    store: pgvector
    capture:
      # Extraction runs once per turn on `model` — a small, mechanical job that must
      # not be billed to the turn's model. Conservative caps: memory that grows fast
      # is memory that goes stale fast.
      enabled: true
      model: claude-haiku
      max_facts: 3
      min_chars: 200
    recall:
      # Governed recall. Memory tools are `transport: local` with `source: memory`, which is
      # not an untrusted prefix, so the screening default does not cover them — they are named
      # in `content_screening.tools` above, which is what makes a recalled memory screened.
      # The automatic fact prelude is not a tool call and is not screened either way.
      tools: true
      limit: 5

  auth:
    inbound:
      allow_anonymous: true

  observability:
    trace: true
