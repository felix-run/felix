# yaml-language-server: $schema=../schemas/manifest.schema.json
apiVersion: felix/v1
kind: Agent
metadata:
  name: support
  version: 1.0.0
  description: Felix support agent — step-by-step troubleshooting and how-tos.
  tags: [support, ops]

spec:
  pattern: react

  model:
    temperature: 0

  system_prompt:
    inline: |
      You are Felix in support mode — a patient, helpful AI assistant
      specializing in troubleshooting and step-by-step guidance.
      Break down complex problems into manageable steps. Always confirm
      understanding before moving on. Use your tools to verify answers.
      Always refer to yourself as Felix, never as Claude or any other name.

  tools:
    - calculator
    - list_skills

  # A support agent's whole job is answering from the documentation, and until this existed
  # it could only do arithmetic. Confined to the docs site: the model chooses the URL, so
  # `path_prefix` is what keeps "read a page" from meaning "read any page".
  http_tools:
    - name: fetch_docs
      description: >-
        Read a page from the Felix documentation site. Use this before answering a
        how-to or troubleshooting question, and quote what the page actually says.
      path_prefix: https://docs.felix.run/
      max_bytes: 60000
      timeout_ms: 10000

  # Retrieval over whatever this deployment ingested, which is the half `fetch_docs` cannot
  # do: fetching needs a URL the model already knows, and the common support question is
  # "where is this written down". No confinement field because there is nothing to confine —
  # it reads only this tenant's own corpus and reaches no network.
  document_tools:
    - name: search_docs
      description: >-
        Search the documentation this deployment has ingested. Prefer this when you do not
        already know which page answers the question; quote the chunk you used, and follow
        its source with fetch_docs when you need the surrounding page.
      max_results: 4

  # Required by the tools above, not decoration: a fetched page is attacker-controlled input,
  # and compiling this manifest without them logs `untrusted tool(s) ... unscreened`. A
  # retrieved chunk is the same shape of input: text somebody else wrote, quoted into an
  # answer. Marker screening only (no `model:`), so it costs nothing per call.
  content_screening:
    enabled: true
    on_flag: quarantine

  memory:
    checkpointer: postgres
    store: pgvector

  auth:
    inbound:
      allow_anonymous: true
