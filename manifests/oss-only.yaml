# yaml-language-server: $schema=../schemas/manifest.schema.json
apiVersion: felix/v1
kind: Agent
metadata:
  name: oss-only
  version: 1.0.0
  description: >-
    Open-weight agent — runs on GLM-5.3 via Cloudflare Workers AI with no
    Anthropic/OpenAI keys. Needs a "workers_ai" entry in
    FELIX_MODEL_PROVIDER_OPTIONS (api_key, account_id, optional gateway_id).
  tags: [react, oss, workers-ai]
  starters:
    - title: "Pick an open model"
      prompt: "When would you pick an open-weight model over a proprietary one for coding help, and why?"
    - title: "Cut inference cost"
      prompt: "Give three practical ways to lower the per-turn cost of an agent running on hosted open models."

spec:
  pattern: react

  model:
    id: glm-5.3-cf
    temperature: 0

  system_prompt:
    inline: |
      You are Felix, a helpful AI assistant running entirely on open-weight
      models served by Cloudflare Workers AI. Use your tools when they help
      you answer accurately.
      Always refer to yourself as Felix, never as Claude or any other name.

  tools:
    - calculator
    - list_skills
    - activate_skill
    - deactivate_skill

  memory:
    checkpointer: postgres
    store: pgvector

  auth:
    inbound:
      allow_anonymous: true

  observability:
    trace: true
