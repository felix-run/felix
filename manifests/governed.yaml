# yaml-language-server: $schema=../schemas/manifest.schema.json
# Production-shaped example — JWT/api_key callers only.
# Validate: felix validate-manifest manifests/governed.yaml -e production
# Docs: deploy/GOVERNANCE.md
apiVersion: felix/v1
kind: Agent
metadata:
  name: governed
  version: 1.0.0
  description: >
    Production-shaped Felix agent with opt-in SOC2 / EU AI Act control mapping,
    secret refs for outbound MCP, inbound scopes, and compile pinning.
  tags: [react, governance, production]

spec:
  pattern: react

  model:
    temperature: 0

  system_prompt:
    inline: |
      You are Felix in governed mode — a careful assistant for production workloads.
      Prefer tools when they improve accuracy. Do not invent credentials or URLs.
      Always refer to yourself as Felix, never as Claude or any other name.

  tools:
    - calculator
    - list_skills
    - activate_skill
    - deactivate_skill

  skills:
    - name: calculator-help

  # Optional outbound MCP — leave commented until the secret exists.
  # Uncomment and set FELIX_MCP_AUTH_TOKEN (env / Secrets Manager) first:
  # mcp_servers:
  #   - name: docs
  #     url: https://example.com/mcp
  #     transport: http
  #     auth: secret:FELIX_MCP_AUTH_TOKEN

  session:
    strategy: compacting
    reserve_tokens: 16384
    keep_recent_tokens: 20000
    context_window_tokens: 128000
    compaction_enabled: true

  memory:
    checkpointer: postgres
    store: pgvector
    capture:
      # Extraction runs once per turn on `model` — a small, mechanical job that must
      # not be billed to the turn's model. Conservative caps: memory that grows fast
      # is memory that goes stale fast.
      enabled: true
      model: claude-haiku
      max_facts: 3
      min_chars: 200
    recall:
      # Governed recall. The tools are bound above the wrapper stack, so a recalled
      # memory passes through content screening; the automatic fact prelude does not.
      tools: true
      limit: 5

  auth:
    inbound:
      allow_anonymous: false
      schemes: [jwt, api_key]
      required_scopes: [chat:write]

  policies:
    - id: calc-scope
      description: Calculator requires tools:calc
      required_scopes: [tools:calc]
      tools: [calculator]

  limits:
    max_tool_calls: 100
    max_wall_clock_seconds: 600

  approvals:
    - id: skill-activate
      description: Confirm skill activation
      tools: [activate_skill]
      ttl_seconds: 600
      allow_unattended: false
    # `list_memories` prints every row id and `forget` retires one, so an injected
    # turn could enumerate and retire the store within one tool budget. Recoverable
    # -- rows are hidden, not deleted -- but silent, and nothing distinguishes a
    # sweep from ordinary use.
    - id: memory-forget
      description: Confirm retiring a stored memory
      tools: [forget]
      ttl_seconds: 600
      allow_unattended: false
    # The other retirement route. `remember` with a topic_key retires whatever else
    # holds that key, and `recall` prints every stored topic_key -- so an injected turn
    # could harvest the keys and retire the rows behind them without ever touching
    # `forget`. Gated only when the key is present, so ordinary capture is unaffected.
    #
    # This closes the tool route, not the sweep. `capture_from_turn` reaches the same
    # supersession post-turn without a tool call, so it passes through no wrapper here
    # -- harder to aim, since it needs the extractor steered onto the victim's key, but
    # ungated. Closing that half is a store-level rule, not a manifest one.
    - id: memory-retopic
      description: Confirm replacing the current value of a remembered topic
      tools: [remember]
      when_args: [topic_key]
      ttl_seconds: 600
      allow_unattended: false

  content_screening:
    enabled: true
    on_flag: quarantine
    # Optional LLM screener — leave empty for marker-only (default).
    # model: llama-3-fast

  command_screening:
    enabled: true
    include_defaults: true

  guardrails:
    providers: [pii]
    targets: [input, output]

  anomaly:
    enabled: true

  observability:
    trace: true

  governance:
    frameworks: [soc2, eu_ai_act]
    risk_tier: limited
    transparency_notice: true
    forbid_plaintext_secrets: true
    pin_compile: true
    retention_days: 30
