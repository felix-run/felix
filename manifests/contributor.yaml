# yaml-language-server: $schema=../schemas/manifest.schema.json
# Felix working on Felix — rung 2 and 3 of docs/SELF.md. Workspace file tools over its own
# checkout, a governed shell that runs the repository's gates in that checkout, developer
# skills, and GitHub over MCP so it can publish a branch and a pull request.
#
# Requires, on the process running the API (deploy/docker/compose.self.yml sets all three):
#   FELIX_WORKSPACE_ROOT=/workspace         # the clone this agent edits and runs the gates in
#   FELIX_SHELL_ALLOWED_COMMANDS=...        # must cover every prefix under shell_tools below
#   GITHUB_MCP_TOKEN=<fine-grained PAT>     # Contents:write + Pull requests:write + Issues:write
#
# The host those run on is the shell tool's boundary — deploy/GOVERNANCE.md "Shell tools" says
# what it must not hold. That is why the builder container exists; do not point this at a
# checkout a person works in.
#
# Validate (the write check needs the operator allowlist, as a deployment would):
#   FELIX_SHELL_ALLOWED_COMMANDS="uv run ruff,uv run ty,./scripts/test.sh,make lint,make type,make test,make schema,uv run felix validate-manifest,git status,git diff,git log,git fetch,git switch,git restore,git stash,git add,git commit,git branch" \
#     felix validate-manifest manifests/contributor.yaml -e production
apiVersion: felix/v1
kind: Agent
metadata:
  name: contributor
  version: 2.0.0
  description: >
    Felix as a contributor to its own codebase — edits the workspace checkout, runs the
    repository's gates in it through a governed shell, and publishes through GitHub MCP.
  tags: [react, coding, workspace, shell, mcp]

spec:
  pattern: react

  model:
    temperature: 0
    # Ephemeral prompt caching on the system prompt and the conversation tail. The first
    # triage run paid $1.04 for ten model calls with zero cache reads — 339k input tokens
    # of the same skill catalogue and transcript re-sent every turn.
    cache: true

  system_prompt:
    # No `files:` here on purpose. context_files._tenant_key rewrites every system_prompt.files
    # key to workspace/<tenant>/<key>, so `files: [CLAUDE.md]` would resolve to
    # $FELIX_WORKSPACE_ROOT/workspace/default/CLAUDE.md — which does not exist — and the miss is
    # silent. The workspace *tools* use a different root with no tenant prefix, so the prompt
    # tells the agent to read CLAUDE.md itself, which does work.
    inline: |
      You are Felix, working on the Felix codebase itself. docs/SELF.md at the workspace root is
      the contract for this work and outranks this prompt; read it and CLAUDE.md before your
      first change in a session.

      Every run, first:
      - Search open issues for the label felix:paused. If one exists, stop and say so.
      - Take one ticket only, and only one carrying felix:go. Read it in full. If its surface
        names a path on the self-modification boundary in docs/SELF.md, stop: that ticket is a
        person's.

      How to work:
      - Start clean: run ["git","fetch","origin"] then ["git","switch","-C","felix/<issue>-<slug>","origin/main"].
      - Read before you write. Open the file you are about to change and the code that calls
        it. Never invent an API, a flag, or a file path — confirm it exists first.
      - Make small, reversible changes. One concern per change; the ticket's out_of_scope is
        binding. Touch only the files the ticket names.
      - write_file replaces a whole file. Read the current contents first and reproduce them
        exactly except for your edit. Losing an unrelated line is a real failure, not a nit.
      - Follow the conventions already in the file you are editing over any general habit.
      - Activate the skill that matches the work before starting it: felix-architecture for
        where things live, felix-conventions for how to write it, felix-testing for how to
        verify it, felix-contributing for how it ships, felix-self for the ticket contract.

      The gates, through the run tool (argv, no shell — each token is one list item):
      - The ticket's acceptance command first, then ["uv","run","ruff","check","."],
        ["uv","run","ruff","format","--check","."], ["uv","run","ty","check","packages","apps"],
        ["./scripts/test.sh","-q"], and ["uv","run","felix","validate-manifest",...] or
        ["make","schema"] when a manifest or the schema changed.
      - Paste the literal tail of each gate's output into your report. A gate you did not run
        is listed under "Not verified", never described as passed. A gate that failed is
        quoted, not summarised.
      - Commit in the checkout with ["git","add",...] and ["git","commit","-m",...] so the
        diff is recorded; that commit never leaves the machine by git.

      Publishing, through the github__ tools only, each of which pauses for a person:
      - github__create_branch felix/<issue>-<slug> from main, github__push_files with the
        files you changed, github__create_pull_request as a draft whose body follows
        .github/PULL_REQUEST_TEMPLATE.md exactly: "Closes #<issue>", the evidence re-verified at
        the HEAD you branched from, "## Gates run" with the pasted output, "## Not verified",
        "## Companions", and the "Felix-Thread:" trailer.
      - Apply felix:authored. Flip the pull request to ready only after
        github__get_pull_request_status reports every check green. Never merge, approve, or
        request changes; never apply p1, p2, p3 or felix:go.

      What you cannot do, and must not pretend to do:
      - The run tool execs only the prefixes it lists. It cannot push, cannot call gh, cannot
        run arbitrary python. If a gate needs something outside that list, say so and stop.
      - Editing the workspace does not change GitHub, and pushing to GitHub does not change
        the workspace. When you have done both, say so; when you have done only one, say which.

      Reporting:
      - State plainly what you changed, what you verified with which command, and what you
        could not verify. Always refer to yourself as Felix, never as Claude or any other name.

  tools:
    - list_dir
    - read_file
    - search_files
    - write_file
    - list_skills
    - activate_skill
    - deactivate_skill

  skills:
    - name: felix-architecture
    - name: felix-conventions
    - name: felix-testing
    - name: felix-contributing
    - name: felix-self

  # The governed shell: argv prefixes, no interpreter, execs in FELIX_WORKSPACE_ROOT with a
  # five-variable environment, killed as a process group at the timeout. Every prefix here must
  # be covered by FELIX_SHELL_ALLOWED_COMMANDS or the manifest is refused at write — the
  # operator bounds, the manifest narrows. The list is the gates plus the git verbs that stay
  # inside the checkout: no push, no remote, no config, no gh, no bare python. Publishing goes
  # through github__ below, where a person approves it. tests/unit/test_contributor_manifest.py
  # holds this list equal to the one deploy/docker/compose.self.yml exports.
  shell_tools:
    - name: run
      description: >
        Run one of the repository's gates or a read-only git command in the workspace checkout.
        argv only — no shell, no pipes; each token is one list item.
      timeout_ms: 900000
      commands:
        - uv run ruff
        - uv run ty
        - ./scripts/test.sh
        - make lint
        - make type
        - make test
        - make schema
        - uv run felix validate-manifest
        - git status
        - git diff
        - git log
        - git fetch
        - git switch
        - git restore
        - git stash
        - git add
        - git commit
        - git branch
        # Read-only: what origin/main holds, and the sha an evidence line names.
        - git show
        - git rev-parse

  # Tools bind as github__<remote tool>. `tools:` is an allowlist over the remote catalogue
  # (`McpServerRef.tools` in manifests/schema.py says why); every write below has an approval
  # rule, and tests/unit/test_contributor_manifest.py proves it. A name GitHub no longer serves
  # is logged at bind time, not refused. Binding failure as a whole is logged and non-fatal, so an
  # unreachable server yields an agent with no GitHub tools rather than an error — check the log,
  # not the reply, before believing this works.
  #
  # Never bound, on purpose: merge_pull_request, pull_request_review_write,
  # add_comment_to_pending_review, request_copilot_review, delete_file, create_repository,
  # fork_repository, run_secret_scanning. Merging and reviewing are a person's; a tool that is not
  # bound needs no approval rule.
  mcp_servers:
    - name: github
      transport: http
      url: https://api.githubcopilot.com/mcp/x/all
      auth: secret:GITHUB_MCP_TOKEN
      tools:
        # read
        - get_me
        - get_file_contents
        - search_code
        - search_issues
        - search_pull_requests
        - list_issues
        - issue_read
        - list_pull_requests
        - pull_request_read
        - list_commits
        - get_commit
        - list_branches
        - actions_list
        - actions_get
        - get_job_logs
        # write — every one of these is named in the approval rule below
        - create_branch
        - push_files
        - create_or_update_file
        - create_pull_request
        - update_pull_request
        - update_pull_request_branch
        - issue_write
        - sub_issue_write
        - add_issue_comment

  # Approvals pause the run; resume with POST /approvals/{id}/decide.
  #
  # Gated at *publication*, not at every write: write_file and run act inside the builder
  # checkout, which is the boundary deploy/GOVERNANCE.md describes, and a person approving
  # forty file writes is a person who stops reading them. The approval row for push_files
  # carries the files as its arguments — that is the diff about to leave the machine, and it
  # is what the person reads.
  #
  # Rules match tool names by glob, and a literal name beats a pattern. The write tools are
  # listed by name rather than as `github__*` because a glob would gate the read tools too and
  # would hide a write tool that slipped into the allowlist above without a rule here.
  #
  # allow_unattended is only enforced under eu_ai_act at risk_tier high, which is why the
  # governance block below sets exactly that — otherwise the field is decoration.
  approvals:
    - id: github-mutate
      description: Confirm a branch, commit, pull request, or issue against the repository
      tools:
        - github__create_branch
        - github__push_files
        - github__create_or_update_file
        - github__create_pull_request
        - github__update_pull_request
        - github__update_pull_request_branch
        - github__issue_write
        - github__sub_issue_write
        - github__add_issue_comment
      ttl_seconds: 3600
      allow_unattended: false

  # For execution transports — the shell tool is one — every string argument is screened, so
  # this covers argv and stdin. include_defaults brings in destructive rm, disk wipes, fork
  # bombs, curl-pipe-shell, and privilege escalation; the two rules below are belt and braces
  # over prefixes the allowlist already refuses.
  command_screening:
    enabled: true
    include_defaults: true
    approval_ttl_seconds: 300
    rules:
      - pattern: '\bgit\s+push\b'
        decision: deny
        reason: pushes go through the approved github__ tools, not a shell
      - pattern: '\bgh\s+(pr|repo|auth)\b'
        decision: deny
        reason: use the github__ tools so the approval gate applies

  # MCP output is untrusted: issue bodies, pull request comments, and file contents pulled
  # from GitHub are written by strangers, and this agent can write code. Quarantine rather
  # than block so a flagged fetch degrades instead of killing the run.
  content_screening:
    enabled: true
    on_flag: quarantine

  limits:
    max_tool_calls: 200
    max_wall_clock_seconds: 3600
    max_cost_usd: 20

  # Steps the react loop may take; `max_turns` is for the multi-agent patterns and bounds
  # nothing on a react agent.
  recursion_limit: 40

  session:
    strategy: compacting
    reserve_tokens: 16384
    keep_recent_tokens: 20000
    context_window_tokens: 128000
    compaction_enabled: true

  # A shell tool may not be reached anonymously outside development — validate_for_write
  # refuses it, for the reason cowork.yaml records: under auth_mode=none the approvals are
  # anonymous too. The builder stack runs FELIX_AUTH_MODE=api_key.
  auth:
    inbound:
      allow_anonymous: false

  observability:
    trace: true

  # eu_ai_act at risk_tier high is what makes `allow_unattended: false` an enforced compile-time
  # requirement rather than an inert field. It also forces forbid_plaintext_secrets and
  # pin_compile true, and requires the transparency notice plus content screening — all of which
  # this manifest wants anyway.
  governance:
    frameworks: [eu_ai_act]
    risk_tier: high
    transparency_notice: true
    forbid_plaintext_secrets: true
    pin_compile: true
