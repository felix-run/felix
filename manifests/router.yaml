# yaml-language-server: $schema=../schemas/manifest.schema.json
apiVersion: felix/v1
kind: Agent
metadata:
  name: router
  version: 1.0.0
  description: Felix router — classifies intent and dispatches to a sub-agent.
  tags: [router, default]

spec:
  pattern: router

  model:
    temperature: 0
    cache: true

  system_prompt:
    inline: |
      You are a query classifier. Given the user's message, choose exactly one
      of the following routes:
      - quick: direct questions, calculations, simple tasks.
      - deep: complex research, multi-step analysis with a plan.
      - support: troubleshooting, step-by-step guidance, how-to instructions.
      For skill management (list/activate/deactivate), choose quick.

  sub_agents:
    - quick
    - deep
    - support

  memory:
    checkpointer: postgres
    store: pgvector

  # `deep` refuses anonymous callers (its fetch reaches any host), and a router forwards the
  # caller's turn to its child without the child's own inbound check — so the router is held to
  # the strictest child it names. The compile refuses an anonymous router over a closed child.
  auth:
    inbound:
      allow_anonymous: false
