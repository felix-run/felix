# gitleaks configuration: the default ruleset, plus one narrowly-scoped allowlist for a
# false positive that is already in git history and so cannot be edited away.
#
# Before adding or widening an entry, know what does NOT scope one:
#
#   * `paths` — gitleaks ORs the conditions inside an allowlist, so a path excuses every
#     finding of that rule anywhere in the file. `matchCondition = "AND"` is documented for
#     this and was not honoured. An entry here had one, and a real secret in that file went
#     undetected.
#   * a short literal — allowlist regexes match as substrings, so `regexes = ['''key''']`
#     has no metacharacters and, with `regexTarget` of `match` or `line`, silences the rule
#     completely. "Literal" is not "narrow". (With the default target it is inert instead —
#     `regexTarget` is the amplifier, which is why its value is pinned by the unit test.)
#   * `stopwords`, `commits`, `targets` — each widens; `commits` undoes the `fetch-depth: 0`
#     the workflow exists to preserve.
#
# Two checks, and neither covers the other. `tests/unit/test_gitleaks_allowlist.py` pins
# the entries and the permitted keys — that is what catches a `paths`/`stopwords`/`commits`
# entry, the class of defect that actually occurred here twice, and the CI probe below
# provably cannot: the probe directory is not this repo, so a file-scoped suppression
# leaves the repo scan silenced while the probe passes.
#
# What the probe does cover is anything that silences a rule outright. `.github/workflows/security.yml` plants a
# random secret in a throwaway directory alongside this config and fails the build if
# gitleaks does not flag it — so a clean scan means "clean" rather than "suppressed". Run
# the same thing locally before changing anything here:
#
#   probe="$(mktemp -d)"; cp .gitleaks.toml "$probe/"
#   printf 'aws_secret_access_key = "%s"\n' \
#     "$(openssl rand -base64 30 | tr -d '/+=' | head -c 40)" > "$probe/planted.py"
#   docker run --rm -v "$probe:/probe" zricethezav/gitleaks:v8.30.1 dir /probe --redact --exit-code 1
#   # exit 1 with a finding = good. exit 0 = this config is silencing the scanner.
#
# Use a random value. gitleaks allowlists the AWS documentation key
# `wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY`, so probing with it proves nothing — that
# mistake is how the `paths` entry above was reported as verified.

[extend]
useDefault = true

[[rules]]
  id = "generic-api-key"
  [[rules.allowlists]]
    description = """
    `generic-api-key` reads a hostname ending in `-api` followed by `:<port>` as a keyword
    and a credential. The match is an OTLP endpoint in a test parametrize —
    `http://memoturn-api:3001/v1/otel` — asserting the exporter appends a per-signal path.
    The working tree no longer contains it (the test host was renamed), but the string is
    in commit 1552801 and history is scanned.

    Matched as a literal, so it excuses that endpoint wherever it appears and nothing else.
    """
    regexTarget = "line"
    regexes = ['''memoturn-api:3001''']
