repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # `wrangler types` writes the gateway's runtime types; edited by hand they would only be
      # regenerated back.
      - id: trailing-whitespace
        exclude: ^deploy/cloudflare/workspace-gateway/worker-configuration\.d\.ts$
      - id: end-of-file-fixer
        exclude: ^deploy/cloudflare/workspace-gateway/worker-configuration\.d\.ts$
      - id: check-yaml
        # Helm templates are Go templates, and the Compose overlays use the
        # `!override` / `!reset` tags, which a plain YAML parser cannot
        # construct. Both are validated properly in CI instead:
        # `helm lint` and `docker compose config -q` over every overlay --
        # which the docker job did only for the base file until #104, so the
        # exclusions here had been trading one check for none.
        exclude: ^(deploy/helm/|deploy/docker/compose\.(lite|gcp|replicas|self)\.yml$)
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
