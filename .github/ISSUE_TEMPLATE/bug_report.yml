name: Bug report
description: Report unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. For **security** issues, see [SECURITY.md](https://github.com/felix-run/felix/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps, commands, or manifests.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: "0.1.0 or git SHA"
  - type: dropdown
    id: env
    attributes:
      label: Environment
      options:
        - Docker Compose (lean)
        - Docker Compose (full)
        - Helm / Kubernetes
        - Local `make dev`
        - Other
