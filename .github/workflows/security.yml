name: Security

# Felix brokers tenant data, resolves secrets, executes tools, and makes
# outbound requests on model instruction. These scans are the cheap, automatic
# half of that; the felix-security-reviewer subagent covers the judgement half.
#
# Actions and images are pinned by commit SHA / digest, as everywhere else.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a CVE published after a PR merges is still found.
    - cron: "23 5 * * 1"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # `actions` was missing, so the workflows scanned nothing while every other
        # supply-chain control in this repo — SHA-pinned actions, pinned image digests,
        # `uv sync --locked` — is about exactly the files it reads. GitHub reported this
        # repo analysable for both languages and only one was being analysed.
        #
        # A matrix rather than `languages: python,actions` in one init: `category`
        # distinguishes uploads, and two languages sharing one category overwrite each
        # other's results. `fail-fast: false` so a failure in one language still reports
        # the other.
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@c16c0f3f2812ec4bb3750a5ed64873fe2ce0fbef # codeql-bundle-v2.26.3
        with:
          languages: ${{ matrix.language }}
          # `security-extended`, not `security-and-quality`. The two are identical
          # on security queries — quality is the only difference — and the quality
          # suite is a second linter that duplicates ruff without knowing this
          # repo's deliberate exemptions.
          #
          # It produced 88 dismissals before this change: 58 re-reporting what ruff
          # already enforces (`py/ineffectual-statement` is B018, `py/unused-import`
          # is F401), and 30 disagreeing with choices made on purpose —
          # `py/unused-global-variable` cannot see cross-module constant reads, so
          # it flags every exported constant this package has.
          #
          # Security coverage is unchanged. If you want a quality query back, add
          # `.github/codeql/codeql-config.yml` and name it, rather than reinstating
          # the whole suite.
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@c16c0f3f2812ec4bb3750a5ed64873fe2ce0fbef # codeql-bundle-v2.26.3
        with:
          category: /language:${{ matrix.language }}

  # The name branch protection requires, held stable across matrix changes.
  #
  # `main` requires a check literally called `CodeQL` from the Actions app (app_id 15368).
  # Adding the matrix renamed that job to `CodeQL (python)` / `CodeQL (actions)`, so nothing
  # from Actions was called `CodeQL` any more — the only check by that name came from the
  # CodeQL *app*, a different app_id, and GitHub refused it: "Required status check `CodeQL`
  # was not set by the expected GitHub app."
  #
  # Fixed here rather than by editing branch protection, so the required contexts do not have
  # to be re-edited every time this matrix gains or loses a language. `if: always()` because a
  # gate that is skipped when its dependency fails never reports, and a required check that
  # never reports blocks the merge just as hard as a failing one.
  codeql-gate:
    name: CodeQL
    needs: [codeql]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every language analysis must have succeeded
        if: needs.codeql.result != 'success'
        run: |
          echo "CodeQL matrix result: ${{ needs.codeql.result }}"
          exit 1

  dependencies:
    name: Dependency CVEs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Set up Python
        run: uv python install 3.14
      # --all-extras: the extras ship to operators too, so a CVE in boto3 or
      # playwright matters even though the lean image does not install them.
      # --no-emit-workspace: pip-audit cannot hash editable local packages.
      - name: Export the locked dependency set
        run: uv export --no-dev --no-emit-workspace --all-extras --format requirements-txt > requirements-audit.txt
      - name: Audit
        run: uv run --with pip-audit --no-project pip-audit -r requirements-audit.txt --progress-spinner off

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history — a secret removed in a later commit still leaked
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --verbose --exit-code 1
