name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      docker: ${{ steps.filter.outputs.docker }}
      helm: ${{ steps.filter.outputs.helm }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - 'apps/**'
              - 'packages/**'
              - 'tests/**'
              - 'migrations/**'
              - 'manifests/**'
              - 'scripts/**'
              - 'clients/**'
              - 'alembic.ini'
              - 'Makefile'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/**'
            docker:
              - 'Dockerfile'
              - 'docker-compose.yml'
              - 'docker-compose.lite.yml'
              - 'apps/**'
              - 'packages/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/**'
            helm:
              - 'deploy/helm/**'
              - '.github/workflows/**'

  lint:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.14
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .

  typecheck:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.14
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: ty
        run: uv run ty check

  test:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.14
      # Use lean install in CI for speed; full extras remain available locally.
      - name: Install dependencies
        run: uv sync --dev
      - name: Bundle manifests
        run: uv run felix bundle-manifests
      - name: Pytest
        run: uv run pytest -q
        env:
          FELIX_ALLOW_INSECURE: "true"
          FELIX_AUTH_MODE: none
          FELIX_DATABASE_URL: memory://ci
          FELIX_OBJECT_STORE: memory

  eval:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.14
      - name: Install dependencies
        run: uv sync --dev
      - name: Mock eval fixture
        run: >
          uv run felix eval
          --dataset smoke
          --manifest quick
          --fixture fixtures/eval/smoke.json
          --mock
        env:
          FELIX_ALLOW_INSECURE: "true"
          FELIX_AUTH_MODE: none
          FELIX_DATABASE_URL: memory://ci
          FELIX_OBJECT_STORE: memory

  helm:
    needs: changes
    if: needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - name: Helm lint
        run: helm lint deploy/helm/felix

  docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Compose config
        run: docker compose -f docker-compose.yml config --quiet
      - name: Build lean image
        run: docker build --build-arg FELIX_EXTRAS= -t felix:ci .
