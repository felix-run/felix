name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege, stated in the file rather than inherited from a repo setting.
# `default_workflow_permissions` is `read` today, so this changes nothing at runtime —
# but that lives in Settings, is invisible to anyone reading this workflow, and flipping
# it would silently grant write to every job below. `security.yml` already declares this;
# CodeQL's `actions/missing-workflow-permissions` flagged the workflows that did not.
# A job needing more overrides it locally, as `changes` and the review job already do.
permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      docker: ${{ steps.filter.outputs.docker }}
      helm: ${{ steps.filter.outputs.helm }}
      toolkit: ${{ steps.filter.outputs.toolkit }}
      scalar: ${{ steps.filter.outputs.scalar }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            python:
              - 'apps/**'
              - 'packages/**'
              - 'tests/**'
              - 'migrations/**'
              - 'manifests/**'
              - 'scripts/**'
              - 'clients/**'
              - 'alembic.ini'
              - 'Makefile'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/**'
            docker:
              - 'deploy/docker/**'
              - 'apps/**'
              - 'packages/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/**'
            helm:
              - 'deploy/helm/**'
              - '.github/workflows/**'
            # The pinned bundle and its hash live in one file, and the check reaches a
            # third-party CDN — so it runs when that file moves, not on every PR.
            scalar:
              - 'apps/api/src/felix_api/docs.py'
              - 'scripts/check-scalar-sri.py'
            toolkit:
              - '.claude/**'
              - 'CLAUDE.md'
              - 'scripts/validate-toolkit.py'
              - '.github/workflows/**'

  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        # enable-cache defaults to `auto`: on for normal runs, off for the
        # events where a poisoned cache could be written (v10 hardening).
      - name: Set up Python
        run: uv python install 3.14
      - name: Install dependencies
        run: uv sync --locked --dev
      - name: pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure

  lint:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        # enable-cache defaults to `auto`: on for normal runs, off for the
        # events where a poisoned cache could be written (v10 hardening).
      - name: Set up Python
        run: uv python install 3.14
      - name: Verify uv.lock is current
        run: uv lock --check
      - name: Install dependencies
        run: uv sync --locked --all-extras --dev
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      # The docs page loads Scalar from a pinned CDN path under SRI. A version bump
      # that leaves the hash stale blanks /docs while every test stays green, so the
      # pairing is checked here rather than remembered.
      - name: Scalar bundle integrity
        if: needs.changes.outputs.scalar == 'true'
        env:
          FELIX_REQUIRE_SCALAR_SRI: '1'
        run: uv run python scripts/check-scalar-sri.py

  typecheck:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        # enable-cache defaults to `auto`: on for normal runs, off for the
        # events where a poisoned cache could be written (v10 hardening).
      - name: Set up Python
        run: uv python install 3.14
      - name: Install dependencies
        run: uv sync --locked --all-extras --dev
      - name: ty
        # Exclude tests — fakes and fixtures trip ty without adding prod signal.
        run: uv run ty check packages apps

  test:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        # enable-cache defaults to `auto`: on for normal runs, off for the
        # events where a poisoned cache could be written (v10 hardening).
      - name: Set up Python
        run: uv python install 3.14
      # Lean install plus only the extras that gate tests. `--all-extras` would drag in
      # playwright, boto3 and presidio for no coverage; these four are the ones whose
      # absence silently deletes tests (see tests/optional_deps.py).
      - name: Install dependencies
        run: uv sync --locked --dev --extra temporal --extra warehouse --extra sandbox --extra otel
      - name: Bundle manifests
        run: uv run felix bundle-manifests
      # ./scripts/test.sh owns the in-memory test environment — the same
      # entry point `make test` uses, so CI and local runs cannot drift.
      # Coverage floor is the measured number, ratcheted up deliberately —
      # never an aspirational one, which only teaches people to bypass it.
      # REQUIRE_OPTIONAL_EXTRAS turns a missing extra into a failure instead of a
      # collect-time skip: a module-level importorskip removes a whole file from the
      # run without touching the skip count, which reads exactly like a pass.
      - name: Pytest
        env:
          FELIX_REQUIRE_OPTIONAL_EXTRAS: "1"
        run: ./scripts/test.sh -q --cov --cov-report=term:skip-covered --cov-fail-under=70

  # The in-memory stores are the CI test path, and nothing compared them against the
  # Postgres ones they stand in for — so a green suite was evidence about the twin, not
  # about production. This job runs the same contract against a real database.
  conformance:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_USER: felix
          POSTGRES_PASSWORD: conformance
          POSTGRES_DB: felix_conformance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U felix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Thread notifications are the one mechanism that cannot be proved in a single
      # process: the in-process waiter answers first, so Redis is never consulted.
      valkey:
        image: valkey/valkey:8-alpine@sha256:e0eb7c480958d32bdc4357a74bdd70653ae15f2f9b4c93c4a5a9fad1dc471c84
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Set up Python
        run: uv python install 3.14
      - name: Install dependencies
        run: uv sync --locked --dev
      # REQUIRE_* turns a missing service into a failure instead of a skip: a silently
      # skipped arm is a coverage gap that looks exactly like a pass.
      - name: Store conformance (memory + postgres + cross-replica notifications)
        env:
          FELIX_CONFORMANCE_DATABASE_URL: postgresql+psycopg://felix:conformance@localhost:5432/felix_conformance
          FELIX_CONFORMANCE_REQUIRE_POSTGRES: "1"
          FELIX_CONFORMANCE_REDIS_URL: redis://localhost:6379/9
          FELIX_CONFORMANCE_REQUIRE_REDIS: "1"
        run: ./scripts/test.sh tests/conformance -q

  eval:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        # enable-cache defaults to `auto`: on for normal runs, off for the
        # events where a poisoned cache could be written (v10 hardening).
      - name: Set up Python
        run: uv python install 3.14
      - name: Install dependencies
        run: uv sync --locked --dev
      - name: Mock eval fixture
        run: >
          uv run felix eval
          --dataset smoke
          --manifest quick
          --fixture fixtures/eval/smoke.json
          --mock
        env:
          FELIX_ALLOW_INSECURE: "true"
          FELIX_AUTH_MODE: none
          FELIX_DATABASE_URL: memory://ci
          FELIX_OBJECT_STORE: memory

  lean:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Set up Python
        run: uv python install 3.14
      # No dev group, no extras — exactly what the default Docker image gets.
      # An optional dependency imported at module scope fails here instead of
      # in an operator's container.
      - name: Lean install
        run: uv sync --locked --no-dev
      # Every module, not just the top-level packages: a stray import in a
      # module nothing else pulls in would otherwise stay invisible.
      - name: Import every module
        run: uv run --no-sync python scripts/lean-import-check.py
      - name: CLI runs
        run: uv run --no-sync felix version

  toolkit:
    needs: changes
    if: needs.changes.outputs.toolkit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate hooks, settings, subagents, and skills
        run: python3 scripts/validate-toolkit.py

  helm:
    needs: changes
    if: needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Helm lint
        run: helm lint deploy/helm/felix

  docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Every overlay, not just the base file. `check-yaml` cannot parse the ones
      # using Compose's `!override` / `!reset` tags and skips them, so this is the
      # only thing standing between an overlay and a typo nobody notices until
      # someone runs the matching `make up-*` target.
      - name: Compose config
        run: |
          set -euo pipefail
          # Each overlay passed as separate arguments rather than one splittable
          # string: the combinations mirror the COMPOSE_* variables in the Makefile,
          # so what CI validates is what `make up-*` actually runs.
          check() {
            echo "::group::compose.yml $*"
            docker compose -f deploy/docker/compose.yml "$@" --project-directory . config --quiet
            echo "::endgroup::"
          }
          check
          check -f deploy/docker/compose.lite.yml
          check -f deploy/docker/compose.gcp.yml -f deploy/docker/compose.lite.yml
          check -f deploy/docker/compose.pgbouncer.yml
          check -f deploy/docker/compose.replicas.yml
        env:
          POSTGRES_PASSWORD: ci-compose-check-not-a-secret
          MINIO_ROOT_PASSWORD: ci-compose-check-not-a-secret
          # Compose requires an API key now that auth_mode defaults to api_key —
          # the interpolation check has to supply one. `make up` generates a real
          # key into .env; this value only has to be non-empty.
          FELIX_AUTH_API_KEYS: '{"sk-ci-compose-check-not-a-secret":{"tenant_id":"default","sub":"ci","scopes":["admin"]}}'
          # The gcp overlay pins `secrets_backend=gcp`, which refuses to interpolate
          # without a project. Only needed because this step now validates that
          # overlay at all — nothing did before, so nothing had hit this.
          FELIX_GCP_PROJECT: ci-compose-check
          # Likewise: the gcp overlay deploys a published image rather than building
          # one, so it demands a tag. Any non-empty value satisfies an interpolation
          # check -- this step parses the file, it does not pull anything.
          FELIX_IMAGE_TAG: ci-compose-check
      - name: Build lean image
        run: docker build -f deploy/docker/Dockerfile --build-arg FELIX_EXTRAS= -t felix:ci .
      # Scans the image we actually ship, OS packages included. Unfixed
      # findings are reported but do not fail the build — there is nothing to
      # act on until upstream ships a patch.
      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: felix:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
