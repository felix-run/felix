name: Smoke

# Prod health + one live chat turn against the API.
# Does not block PR CI. Requires repo secret FELIX_SMOKE_API_KEY
# (a key present in the server's FELIX_AUTH_API_KEYS map).

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: smoke
  cancel-in-progress: true

# Least privilege, stated in the file rather than inherited from a repo setting.
# `default_workflow_permissions` is `read` today, so this changes nothing at runtime —
# but that lives in Settings, is invisible to anyone reading this workflow, and flipping
# it would silently grant write to every job below. `security.yml` already declares this;
# CodeQL's `actions/missing-workflow-permissions` flagged the workflows that did not.
# A job needing more overrides it locally, as `changes` and the review job already do.
permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://api.felix.run
      API_KEY: ${{ secrets.FELIX_SMOKE_API_KEY }}
    steps:
      - name: Require smoke API key
        run: |
          if [ -z "$API_KEY" ]; then
            echo "Set repo secret FELIX_SMOKE_API_KEY" >&2
            exit 1
          fi

      - name: Health
        run: |
          set -euo pipefail
          body="$(curl -sfS --max-time 20 "$BASE_URL/health")"
          echo "$body"
          echo "$body" | grep -q '"status":"ok"'

      - name: Sync chat (quick)
        # Uses quick (non-durable) so CI proves auth + model without depending
        # on the Taskiq worker draining fibers.
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer ${API_KEY}"
          code="$(curl -sS -o /tmp/chat.json -w '%{http_code}' --max-time 90 \
            -X POST "$BASE_URL/chat" \
            -H "$AUTH" \
            -H 'content-type: application/json' \
            -d '{"manifest":"quick","messages":[{"role":"user","content":"Reply with exactly: pong"}]}')"
          echo "POST /chat → $code"
          cat /tmp/chat.json
          echo
          test "$code" = "200"
          python3 - <<'PY'
          import json
          body = json.load(open("/tmp/chat.json"))
          final = body.get("final") or {}
          content = (final.get("content") or "").lower()
          assert "pong" in content or content, body
          print("ok", content[:80])
          PY

      - name: Cowork durable accept
        # Assert durable path accepts work (202). Completion is worker-dependent.
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer ${API_KEY}"
          code="$(curl -sS -o /tmp/cowork.json -w '%{http_code}' --max-time 30 \
            -X POST "$BASE_URL/chat" \
            -H "$AUTH" \
            -H 'content-type: application/json' \
            -d '{"manifest":"cowork","messages":[{"role":"user","content":"noop smoke"}]}')"
          echo "POST /chat cowork → $code"
          cat /tmp/cowork.json
          echo
          test "$code" = "202"
          python3 -c 'import json; b=json.load(open("/tmp/cowork.json")); assert b.get("resume_token")'

      - name: Session surfaces (thinking, lease, search, abort)
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer ${API_KEY}"
          TID="smoke-ci-$(date +%s)"

          code="$(curl -sS -o /tmp/think.json -w '%{http_code}' --max-time 20 \
            -X POST "$BASE_URL/chat/thinking" \
            -H "$AUTH" -H 'content-type: application/json' \
            -d "{\"thread_id\":\"$TID\",\"thinking_level\":\"low\"}")"
          echo "POST /chat/thinking → $code"
          cat /tmp/think.json; echo
          test "$code" = "200"
          python3 -c 'import json; b=json.load(open("/tmp/think.json")); assert b.get("ok") and b.get("thinking_level")=="low"'

          code="$(curl -sS -o /tmp/lease.json -w '%{http_code}' --max-time 20 \
            -X POST "$BASE_URL/chat/sessions/lease" \
            -H "$AUTH" -H 'content-type: application/json' \
            -d "{\"thread_id\":\"$TID\",\"holder_id\":\"smoke-ci\",\"mode\":\"exclusive\"}")"
          echo "POST /chat/sessions/lease → $code"
          cat /tmp/lease.json; echo
          test "$code" = "200"
          python3 -c 'import json; b=json.load(open("/tmp/lease.json")); assert b.get("ok") and b.get("token")'

          code="$(curl -sS -o /tmp/custom.json -w '%{http_code}' --max-time 20 \
            -X POST "$BASE_URL/chat/sessions/custom" \
            -H "$AUTH" -H 'content-type: application/json' \
            -d "{\"thread_id\":\"$TID\",\"role\":\"user\",\"content\":\"smoke-ci zucchini marker\",\"in_context\":true}")"
          echo "POST /chat/sessions/custom → $code"
          test "$code" = "200"

          code="$(curl -sS -o /tmp/search.json -w '%{http_code}' --max-time 20 \
            -H "$AUTH" "$BASE_URL/chat/sessions/search?q=zucchini&limit=5")"
          echo "GET /chat/sessions/search → $code"
          cat /tmp/search.json; echo
          test "$code" = "200"
          python3 -c 'import json; b=json.load(open("/tmp/search.json")); assert any("zucchini" in (h.get("content") or "") for h in b.get("hits") or [])'

          code="$(curl -sS -o /tmp/abort.json -w '%{http_code}' --max-time 20 \
            -X POST "$BASE_URL/chat/abort" \
            -H "$AUTH" -H 'content-type: application/json' \
            -d "{\"thread_id\":\"$TID\"}")"
          echo "POST /chat/abort → $code"
          cat /tmp/abort.json; echo
          test "$code" = "200"
          python3 -c 'import json; b=json.load(open("/tmp/abort.json")); assert b.get("ok"); assert (b.get("snapshot") or {}).get("phase")=="aborted"'

          curl -sS --max-time 20 -X POST "$BASE_URL/chat/sessions/lease/release" \
            -H "$AUTH" -H 'content-type: application/json' \
            -d "{\"thread_id\":\"$TID\",\"holder_id\":\"smoke-ci\"}" >/dev/null
          echo "session surfaces ok"
